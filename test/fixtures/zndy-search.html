    <script>
        function handleSearch(event) {
            const inputVal = document.getElementById('search-input').value.trim();
            if (!inputVal) { event.preventDefault(); return false; }
            event.preventDefault();
            document.getElementById('loading-indicator').classList.remove('hide');
            document.getElementById('loading-indicator').classList.add('show-flex');
            const resultSection = document.getElementById('search-result-section');
            if (resultSection) { resultSection.style.opacity = '0.2'; resultSection.style.pointerEvents = 'none'; }
            // 留出一帧渲染“正在全网为您搜索中”提示，再提交搜索请求。
            setTimeout(() => event.target.submit(), 60);
            return false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('input[name="source"]').forEach(input => {
                input.addEventListener('change', () => {
                    if (document.getElementById('search-input').value.trim()) {
                        input.form.requestSubmit();
                    }
                });
            });
            const todayStr = new Date().toDateString();
            if (localStorage.getItem('hideZnysAnnounceDate') !== todayStr) {
                setTimeout(() => {
                    const popup = document.getElementById('js-announcement');
                    if (popup) popup.classList.add('show');
                }, 1500);
            }
        });

        function closeAnnouncement() {
            const popup = document.getElementById('js-announcement');
            if (popup) {
                popup.classList.remove('show');
                localStorage.setItem('hideZnysAnnounceDate', new Date().toDateString());
            }
        }

        function openHistory() {
            document.body.classList.remove('no-scroll'); renderHistory();
            document.getElementById('js-history-overlay').classList.add('active');
        }
        function closeHistory() { document.getElementById('js-history-overlay').classList.remove('active'); }
        function clearHistory() {
            if(confirm('确定要清空所有本地播放记录吗？')) { localStorage.removeItem('znys_play_history'); renderHistory(); }
        }

        function renderHistory() {
            const listContainer = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('znys_play_history') || '[]');
            if (history.length === 0) { listContainer.innerHTML = '<div class="history-empty text-gray-500 text-center py-8 text-sm">暂无播放记录，快去观看影片吧~</div>'; return; }
            history.sort((a, b) => b.time - a.time);
            listContainer.innerHTML = history.map(item => {
                let date = new Date(item.time);
                let timeStr = `${date.getMonth()+1}-${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                const escape = value => String(value || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
                return `<a href="${escape(item.url)}" class="history-item"><img src="${escape(item.pic)}" class="history-pic" onerror="this.src='/bg.jpg'"><div class="history-info"><div class="history-item-title">${escape(item.title)}</div><div class="history-time">观看至：${escape(item.episode || '正片')}</div><div class="history-time">上次观看: ${timeStr}</div></div></a>`;
            }).join('');
        }
    </script>
