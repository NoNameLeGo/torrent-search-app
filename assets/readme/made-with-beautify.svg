<svg xmlns="http://www.w3.org/2000/svg"
     width="420" height="64" viewBox="0 0 420 64"
     role="img" aria-labelledby="sig-title sig-desc">
  <title id="sig-title">README made with beautify-github-readme</title>
  <desc id="sig-desc">This README was designed with the beautify-github-readme Skill — a theme-specific visual design system for GitHub repository homepages.</desc>

  <defs>
    <linearGradient id="sig-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="sig-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="420" height="64" rx="12" fill="url(#sig-bg)" stroke="#2d3748" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="14" y="18" width="2" height="28" rx="1" fill="#4f8cff"/>

  <!-- Search/magnifying motif -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#4f8cff" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="38" y1="38" x2="43" y2="43" stroke="#4f8cff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Text -->
  <text x="56" y="28" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.8">README MADE WITH</text>
  <text x="56" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="#e2e8f0">beautify-github-readme</text>

  <!-- Arrow -->
  <g transform="translate(390, 28)" stroke="#94a3b8" stroke-width="1.5">
    <line x1="0" y1="4" x2="10" y2="4"/>
    <polyline points="6,0 10,4 6,8" fill="none"/>
  </g>

  <!-- Bottom gradient line -->
  <rect x="0" y="62" width="420" height="2" rx="1" fill="url(#sig-accent)"/>
</svg>
