name: Rust (test)

# Rust 重写主线。
#
# ⚠️ **2026-10-16 切 main**：`main` 已经是 Rust 主线（`feat/rust` 合并进来，
# 见 AGENTS.md「🌿 分支现状」）。触发**两个都要留**：
#   · `main` —— **这是切换的硬性配套**：不加的话，切完 main 之后 Rust 侧
#     一条 CI 都不跑，而整套测试（数量以日志为准）+ bt-app 全链路自检全靠它把关；
#   · `feat/rust` —— 合并后两者同源，留着不至于让旧链接/旧 PR 失效。
# 本机不开构建（用户磁盘两盘 90%+），一律走 CI：编译 + 跑测试都在这里。
on:
  push:
    branches: [feat/rust, main]
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: cargo test
        # ⚠️ `--locked`：Cargo.lock 已入库（`lockfile.yml` 生成），门就必须按它跑 ——
        # 否则「CI 绿」证明的是「当时 crates.io 上那套依赖能编译」。
        run: cargo test --workspace --locked

      # M4：bt-app 的**全链路**自检（无网、无人、无窗口）。
      # 光靠 `cargo test` 证明不了「窗口真能渲染、接线真通」——M4 就在这儿漏过一个
      # tokio 运行时的 panic（回调里裸用 `tokio::spawn`），编译/单测/clippy 全绿。
      # `SLINT_BACKEND=winit-software` 是 M1 验证过的无 GPU 后端（runner 没有 GPU）。
      # 自检自己会在失败时 exit 1，所以这一步是硬门。
      - name: bt-app 全链路自检
        env:
          SLINT_BACKEND: winit-software
          RUST_BACKTRACE: "1"
        run: cargo run --locked -p bt-app --bin bt-search -- --selftest

      # ---- M6 差分验证：Rust 侧 vs Node 侧，**逐字段**比 ----
      # 两侧对**同一批 fixture** 各导出一份规范化 JSON，再逐字段比较；差异未命中
      # `scripts/diff/whitelist.json` 就是红。这是 D18「才准删 Node」的那道门。
      #
      # ⚠️ 为什么用 `-- --ignored` 显式跑 `dump_rust`：它是**差分工具**不是回归测试
      # （否则 `cargo test --workspace` 每次都刷一大坨 JSON）。但**显式**跑是有意的 ——
      # 它失败必须是"响的"，不能变成静默跳过。
      # ⚠️ **必须写 `shell: bash`。** windows-latest 上多行 `run:` 默认走 **PowerShell**，
      # 于是 `set -euo pipefail` 会炸（`set` 是 `Set-Variable` 的别名，
      # 报 "A parameter cannot be found that matches parameter name 'euo'"）。
      # 之前的步骤都是单行命令，所以这个坑一直没暴露 —— 第一次踩是 M6 接线。
      - name: M6 导出 Rust 侧
        shell: bash
        env:
          BT_DIFF_OUT: .cache/diff/rust.json
        run: |
          set -euo pipefail
          mkdir -p .cache/diff
          cargo test --locked -p bt-providers --test dump_rust -- --ignored --nocapture

      # 11 家 HTML provider 的 Node 侧要 `cheerio`。
      # ⚠️ `--omit=dev` 是刻意的：devDeps 里的 electron / electron-builder / tauri-cli
      # 有几百 MB，而 M6 只需要运行时依赖（express / axios / cheerio）。
      - name: 安装 Node 依赖（HTML provider 需要 cheerio）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci --omit=dev
        shell: bash
        run: npm ci --omit=dev

      - name: M6 导出 Node 侧并比较（全 20 家）
        shell: bash
        run: |
          set -euo pipefail
          # 🎉 **2026-10-16：门已放开到 16 家全量；2026-10-22 扩到 20 家**
          # （新增 subsplease / dmhy / mikan / animetosho，四家的 fixture 都是真实快照）。
          #
          # 首次全量跑（同一天早些时候）曾抓到 111 处未命中白名单的差异，
          # triage 期间门收在 5 家上（`--json-only` + `--only`）。现在那些都清掉了：
          #   · 约 100 处 = megapeer 的 windows-1251 那条**已知有意 divergence** 的
          #     连带损伤（俄语月份名被 axios 按 utf8 解坏 ⇒ date 解析不出）⇒ 补白名单
          #   · 7 处 = harness 造的假差异（origin 处理不对称）⇒ 改**通用剥离**
          #   · 3 处 = **真移植 bug**：`format_size` 的平局取舍（JS toFixed 平局向上、
          #     Rust `{:.1}` 平局取偶 ⇒ 3.25 得 3.2 vs 3.3）⇒ 修 bt-core
          #   · 1 处 = **本质非确定性**（limetorrents 日期用当前时间换算）⇒ 只比形状
          #
          # ⚠️ **别再加回 `--json-only` / `--only`** —— 那会让部分 provider 静默退出
          # 差分，而"覆盖面静默缩水"正是 M6 最不能出的问题。
          # 只想看报告、不想让门变红时，用探针：`gh workflow run m6-diff.yml --ref main`
          # （它只挂 workflow_dispatch，跑的就是这条全量比较）。
          node scripts/diff/dump-node.cjs -o .cache/diff/node.json
          node scripts/diff/compare.cjs .cache/diff/rust.json .cache/diff/node.json

      # 首轮先不做 -D warnings，避免被 lint 噪音挡住"移植是否等价"这个主要信号。
      # 稳定下来后再收紧。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
