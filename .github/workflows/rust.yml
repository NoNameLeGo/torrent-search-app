name: Rust (test)

# Rust 重写主线。
#
# ⚠️ **2026-10-16 切 main**：`main` 已经是 Rust 主线（`feat/rust` 合并进来，
# 见 AGENTS.md「🌿 分支现状」）。触发**两个都要留**：
#   · `main` —— **这是切换的硬性配套**：不加的话，切完 main 之后 Rust 侧
#     一条 CI 都不跑，而 397 条测试 + bt-app 全链路自检全靠它把关；
#   · `feat/rust` —— 合并后两者同源，留着不至于让旧链接/旧 PR 失效。
# 本机不开构建（用户磁盘两盘 90%+），一律走 CI：编译 + 跑测试都在这里。
on:
  push:
    branches: [feat/rust, main]
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: cargo test
        run: cargo test --workspace

      # M4：bt-app 的**全链路**自检（无网、无人、无窗口）。
      # 光靠 `cargo test` 证明不了「窗口真能渲染、接线真通」——M4 就在这儿漏过一个
      # tokio 运行时的 panic（回调里裸用 `tokio::spawn`），编译/单测/clippy 全绿。
      # `SLINT_BACKEND=winit-software` 是 M1 验证过的无 GPU 后端（runner 没有 GPU）。
      # 自检自己会在失败时 exit 1，所以这一步是硬门。
      - name: bt-app 全链路自检
        env:
          SLINT_BACKEND: winit-software
          RUST_BACKTRACE: "1"
        run: cargo run -p bt-app --bin bt-search -- --selftest

      # ---- M6 差分验证：Rust 侧 vs Node 侧，**逐字段**比 ----
      # 两侧对**同一批 fixture** 各导出一份规范化 JSON，再逐字段比较；差异未命中
      # `scripts/diff/whitelist.json` 就是红。这是 D18「才准删 Node」的那道门。
      #
      # ⚠️ 为什么用 `-- --ignored` 显式跑 `dump_rust`：它是**差分工具**不是回归测试
      # （否则 `cargo test --workspace` 每次都刷一大坨 JSON）。但**显式**跑是有意的 ——
      # 它失败必须是"响的"，不能变成静默跳过。
      # ⚠️ **必须写 `shell: bash`。** windows-latest 上多行 `run:` 默认走 **PowerShell**，
      # 于是 `set -euo pipefail` 会炸（`set` 是 `Set-Variable` 的别名，
      # 报 "A parameter cannot be found that matches parameter name 'euo'"）。
      # 之前的步骤都是单行命令，所以这个坑一直没暴露 —— 第一次踩是 M6 接线。
      - name: M6 导出 Rust 侧
        shell: bash
        env:
          BT_DIFF_OUT: .cache/diff/rust.json
        run: |
          set -euo pipefail
          mkdir -p .cache/diff
          cargo test -p bt-providers --test dump_rust -- --ignored --nocapture

      # 11 家 HTML provider 的 Node 侧要 `cheerio`。
      # ⚠️ `--omit=dev` 是刻意的：devDeps 里的 electron / electron-builder / tauri-cli
      # 有几百 MB，而 M6 只需要运行时依赖（express / axios / cheerio）。
      - name: 安装 Node 依赖（HTML provider 需要 cheerio）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci --omit=dev
        shell: bash
        run: npm ci --omit=dev

      - name: M6 导出 Node 侧并比较
        shell: bash
        run: |
          set -euo pipefail
          # ⚠️ **`--json-only` 是暂时的、且是「已登记的欠账」，不是设计。**
          #
          # 2026-10-16 首次全量跑（16 家）抓到 **111 处未命中白名单的差异**，
          # 集中在 5 家：internetarchive / linuxtracker / rutor / limetorrents / megapeer。
          # 约一半是 **harness 造的假差异** —— 几家 provider 的 detail_url 用**硬编码
          # 域名**（不在"本侧 base"里），所以 origin 归一化没盖住它们。
          # 另一半是**真差异**：size_text 舍入分歧（3.2 vs 3.3 GB）、
          # Rust 产出了 Node 没有的 date（"2026-10-11" vs "—"）、毫秒级 date 差。
          #
          # 门暂时只留在**已验证零差异的那 5 家 JSON provider** 上：
          # 这 111 处还没 triage，拿它们当门只会逼人往白名单里塞东西。
          # 完整清单见 AGENTS.md「M6」。
          #
          # 🔴 triage 完成后**必须摘掉这个开关**（`--json-only` 会让 11 家静默退出差分，
          # 而"覆盖面静默缩水"正是 M6 最不能出的问题）。摘之前先把 origin 处理改成
          # **通用剥离**（`^https?://[^/]+` → `<BASE>`），否则那批假差异会一直在。
          node scripts/diff/dump-node.cjs --json-only -o .cache/diff/node.json
          # `--only` = 本次比的显式作用域（两侧会被裁到同一集合）。
          # ⚠️ 它**不是**放宽检查：作用域**内**的 provider 仍要求两侧都在，
          # 少一边照样 fatal。之所以需要它，是因为 triage 期间两侧覆盖面不同
          # （Rust 已导出 16 家、这里的 Node 只跑 5 家 JSON）——
          # 而 compare 对「只在一边出现」是判结构性失败的，那是对的，别去改它。
          node scripts/diff/compare.cjs .cache/diff/rust.json .cache/diff/node.json \
            --only tpb,knaben,torrentscsv,yts,internetarchive

      # 首轮先不做 -D warnings，避免被 lint 噪音挡住"移植是否等价"这个主要信号。
      # 稳定下来后再收紧。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
