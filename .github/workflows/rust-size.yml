name: Rust exe size (S1/S2 探针)

# 目的：量 **S1「单文件自包含 exe」的体积**、并给 **S2「零运行时依赖」** 一个机器判据。
#
# ⚠️ 为什么单开一个而不是用 `release.yml` 的手动触发：
# release.yml 的手动触发会**顺带构建 Electron 与 Tauri 两个安装包**（20+ 分钟），
# 而量体积只需要 `cargo build --release -p bt-app`。
#
# ⚠️ **它是门，不是探针**（2026-10-16 审计后改的）：`AGENTS.md` 一直写
# 「体积回归门（25MB，`rust-size.yml`）✅」，但它此前只挂 `workflow_dispatch`
# ⇒ 实际上是「谁也不跑的手动探针」，那条 ✅ 是假的。真·探针是
# `m6-diff.yml` / `provider-health.yml` 那两个（它们只该手动跑）。
# 现在它跟 `push main` 走 —— 只在 **碰了 Cargo.toml / crates/** 时触发，
# 因为体积只可能被这两类改动动到；改文档不该白花 5 分钟重编一遍。
#
# ## 2026-10-16 第一次跑的结论（**口径很重要，别误读**）
#
#   · 静态 CRT 口径：**18,610,176 字节（18.0MB）**
#   · 依赖 DLL 全是 Windows 系统 DLL（kernel32/user32/gdi32/opengl32/dwrite…），
#     **没有 vcruntime140.dll / msvcp140.dll** ⇒ 静态 CRT 生效
#
# ⚠️ 这次**没有**"变大"这件事：M1 的 14.5MB（15,200,768 字节）是
# **`spike/slint-ui` 的 exe**（一个最小 UI 探针），**不是 bt-app**，而且当时**没有**静态 CRT。
# 不同程序 + 不同链接口径，**不可直接比**。
# 真正有意义的对照是 **Electron portable = 151,416,455 字节（≈151MB）**。
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      # ⚠️ `Cargo.lock` 必须在这里（2026-10-21 补）：
      # 本 workflow 用 `cargo build --release --locked` 编译，而 lock 文件与
      # `Cargo.toml` 的 version 不同步时 **--locked 会直接报错**。
      # 2026-10-16 那次 `895520a` 把版本 bump 到 0.3.9 却没同步 lock ⇒ 这道门红了；
      # 而修它的 `2dbf9f6` 只改了 `Cargo.lock`，不在 paths 里 ⇒ **修复从未被这道门验证过**。
      # 光改 lock 也能让体积门有意义（换依赖版本正是体积会变的场景）。
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/rust-size.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # ⚠️ **构建两个口径**，否则数字没法解读（第一次跑就踩了这个）：
      #   · 静态 CRT 会把 exe **撑大**（把 MSVC 运行时链进去，+2~3MB），
      #     但那正是 S2 的代价与前提，不是回归
      #   · 只测静态口径的话，lto/strip 的收益被 crt-static 的增量掩盖，看不出净效果
      # 两个用不同的 CARGO_TARGET_DIR，避免 RUSTFLAGS 变化导致互相重建。
      - name: 构建 A —— 静态 CRT（S2 达标形态）
        env:
          # ⚠️ 用 RUSTFLAGS 传，别写进 `.cargo/config.toml` ——
          # 后者会让所有构建（含测试）都跟着变，而这里只需要发布产物是静态的。
          RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_DIR: target-static
        # ⚠️ `--locked`：体积门必须量「钉死的那套依赖」，否则依赖一升体积就漂了。
        run: cargo build --release --locked -p bt-app --bin bt-search

      - name: 构建 B —— 动态 CRT（隔离出 lto/strip 的净收益）
        env:
          CARGO_TARGET_DIR: target
        # 这条**故意不加 `--locked`**：它只是用来隔离 lto/strip 的净收益。
        run: cargo build --release -p bt-app --bin bt-search

      # #3 **体积回归门。**
      #
      # 18MB 单文件 / 8.5MB zip 是这个项目**唯一"非功能但决定性"的卖点**（D7/D12/S1），
      # 但它只会在**发版时**才被人注意到 —— 那时已经晚了。所以在这里钉一个上限：
      # 任何一次改动把 exe 撑过 25MB，这条门（`push main` 且碰了 `crates/**`）就会红。
      #
      # ⚠️ 上限是**预算**而不是"当前值 + 一点余量"：留 ~35% 空间给正常增长，
      #    同时挡住"悄悄多链进来一个几百 KB 的依赖"那种退化。
      - name: 体积回归门（S1）
        shell: bash
        run: |
          set -euo pipefail
          BYTES=$(wc -c < target-static/release/bt-search.exe)
          LIMIT=$((25 * 1024 * 1024))
          MIB=$(awk "BEGIN{printf \"%.2f\", $BYTES/1048576}")
          echo "静态 CRT exe = $BYTES 字节（$MIB MiB），上限 $LIMIT 字节"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "::error::exe 超过 25MB —— 单文件/小体积是核心卖点（D7/D12/S1），别让它悄悄退化"
            exit 1
          fi
          echo "✅ 体积在预算内"

      - name: 报体积（两个口径）
        shell: bash
        run: |
          set -euo pipefail
          echo "=== A 静态 CRT（S2 达标形态）==="
          ls -l target-static/release/bt-search.exe
          du -h target-static/release/bt-search.exe
          echo ""
          echo '=== B 动态 CRT（与「不加 crt-static」同口径）==='
          ls -l target/release/bt-search.exe
          du -h target/release/bt-search.exe
          echo ""
          echo "=== 对照（⚠️ 只是参考量级，**不可直接比**）==="
          echo "  M1 的 14.5MB = **spike/slint-ui 的 exe**（不是 bt-app），且当时没有静态 CRT"
          echo "  真正有意义的对照 = **Electron portable ≈ 151MB**"
          echo ""
          echo "  lto/strip 的净收益 = B 与「同样动态 CRT 但无 lto/strip」之差；"
          echo "  后者没留档 —— 要精确值就临时注释掉 [profile.release] 的三项再跑一次。"

      # S2 的核心判据：这个 exe 依赖哪些 DLL。
      # 「零运行时依赖」= 只依赖 Windows 自带的系统 DLL，没有 MSVC 运行时、没有第三方 DLL。
      - name: 依赖的 DLL（S2 判据，机器断言）
        shell: pwsh
        run: |
          $b = 'target-static/release/bt-search.exe'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Host "::error::找不到 vswhere ⇒ 无法验证 S2（别跳过：这是 S2 的核心判据）"
            exit 1
          }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Join-Path $vs 'VC\Tools\MSVC'
          $dumpbin = (Get-ChildItem $dumpbin -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $dumpbin = Join-Path $dumpbin 'bin\Hostx64\x64\dumpbin.exe'
          if (-not (Test-Path $dumpbin)) {
            Write-Host "::error::找不到 dumpbin ⇒ 无法验证 S2"
            exit 1
          }

          $deps = & $dumpbin /dependents $b | Select-String '^\s+\S+\.dll$' | ForEach-Object { $_.Line.Trim() }
          Write-Host "依赖 $($deps.Count) 个 DLL："
          $deps | ForEach-Object { Write-Host "  $_" }

          # ⚠️ 判据写成**断言**，别只靠人眼看 —— 这一条正是 S2 的核心。
          # 命中就说明 MSVC 运行时没链进去（或只链了一半），干净 Windows 上会起不来。
          $bad = @($deps | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|api-ms-win-crt)' })
          if ($bad.Count -gt 0) {
            Write-Host "::error::出现 MSVC 运行时依赖 ⇒ **S2 未达标**：$($bad -join ', ')"
            exit 1
          }
          Write-Host "✅ 没有 MSVC 运行时依赖 ⇒ S2 的静态链接部分达标"
          Write-Host "⚠️ 这仍是**旁证**：S2 的正式判据是「拷到干净 Windows 双击能跑」（只能人工）。"

          # ---- 子系统：双击会不会弹一个命令行窗口 ----
          #
          # 2026-10-16 补。原因：用户实测"启动时开一个 cmd 窗口"——
          # Rust 默认把 exe 编成 **console 子系统**，哪怕它是 GUI 程序。
          # 修法是代码里那行 `#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]`，
          # 而它**只在 release 生效** ⇒ 正好是这个 workflow 构建的口径。
          #
          # ⚠️ 为什么必须写成断言：那条 cfg_attr 一旦被删/被挪位置，
          # **编译照样通过、测试照样绿**，只有用户双击时才会发现多了个黑框 ——
          # 属于"CI 完全看不见"的回归。dumpbin /headers 能把它变成机器判据。
          #
          # ⚠️⚠️ 匹配的是 `subsystem (Windows GUI)` / `(Windows CUI)` 这一行，
          # 不能只 grep 'subsystem' —— PE 头里**先**有一行
          #     6.00 subsystem version
          # （那是子系统**版本号**），第一版就匹配到了它，报了个假失败。
          # 现在显式要求带括号的那个形态；**匹配不到也报错**（别静默通过）。
          $hdr = & $dumpbin /headers $b
          $allSub = @($hdr | Select-String 'subsystem')
          Write-Host "含 subsystem 的行（$($allSub.Count) 行，供核对）："
          $allSub | ForEach-Object { Write-Host "  $($_.Line.Trim())" }

          $sub = $allSub | Where-Object { $_.Line -match 'subsystem\s+\((Windows GUI|Windows CUI)\)' } | Select-Object -First 1
          if (-not $sub) {
            Write-Host "::error::在 dumpbin /headers 里找不到 `subsystem (Windows GUI|CUI)` 那一行 ⇒ 断言无法验证。**别当成通过** —— 上面的原始输出里能看到真实形态，据此改断言。"
            exit 1
          }
          if ($sub.Line -notmatch 'Windows GUI') {
            Write-Host "::error::子系统是 Windows CUI（控制台程序）⇒ 双击时会弹命令行窗口。检查 crates/bt-app/src/main.rs 顶部那行 windows_subsystem = ""windows""（必须是 crate 级 inner attribute、在第一个 mod 之前）"
            exit 1
          }
          Write-Host "✅ 子系统 = Windows GUI ⇒ 双击不弹控制台（debug 构建仍保留控制台：--selftest/--health 要它）"

      - name: 上传两个口径的 exe（便于在干净机器上实测 S2）
        uses: actions/upload-artifact@v6
        with:
          name: rust-exe-s1s2
          path: |
            target-static/release/bt-search.exe
            target/release/bt-search.exe
          if-no-files-found: error
