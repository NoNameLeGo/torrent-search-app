name: HTML probes (cheerio oracle)

# 生成「选择器语义对照」的真值 —— 用真 cheerio 跑一遍 probe 清单。
#
# 为什么需要它：移植 37 个 HTML provider 之前必须确认 `scraper` 的选择器/取值语义
# 与 cheerio 一致（`text()` 拼接、属性实体解码、组合器的匹配范围…）。
# 本机没有 node_modules（用户要求不在本地装构建环境），所以真值只能在 CI 生成。
#
# 用法：Actions → 这个 workflow → Run workflow → 选分支 **feat/rust**
#       → 日志里会打印 JSON（`node scripts/html-probes.cjs`）
#       → 存成 `test/fixtures/html-probes.expected.json` 提交
#         （之后 crates/bt-core/tests/dom_probes.rs 就会逐条比对）
#
# 它不联网、不跑 Rust，只装一个 cheerio，几秒就完。手动触发，不在任何 push 门上。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 还没生成 probe 清单的 ref 就跳过
        if: hashFiles('test/fixtures/html-probes.json') == ''
        shell: bash
        run: |
          echo "::warning::这个 ref 上没有 test/fixtures/html-probes.json，无事可做。"
          echo "请用 Actions → 这个 workflow → Run workflow → 选分支 feat/rust。"

      # 只装 cheerio，不装 electron/electron-builder 那一堆（它们是 devDependencies）
      - name: 安装 cheerio
        if: hashFiles('test/fixtures/html-probes.json') != ''
        run: >-
          npm install --no-save --no-package-lock --omit=dev --ignore-scripts
          --no-audit --no-fund cheerio

      - name: 打印 cheerio 版本（真值要和版本对得上）
        if: hashFiles('test/fixtures/html-probes.json') != ''
        run: node -e "console.log('cheerio', require('cheerio/package.json').version)"

      - name: 跑探针（把输出复制到 html-probes.expected.json）
        if: hashFiles('test/fixtures/html-probes.json') != ''
        run: node scripts/html-probes.cjs
