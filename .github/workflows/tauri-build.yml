name: Tauri Build (validate)

# Validates that the Tauri app (Rust shell + node.exe sidecar) builds
# on Windows. Builds only — does NOT create a GitHub Release.
on:
  push:
    branches: [feat/tauri]
  # ⚠️ 2026-10-27 改：原写法是 `pull_request: branches: [feat/tauri, main]`，
  # 于是**每个指向 main 的 PR 都会跑它** —— 而 `src-tauri/` 只存在于 `feat/tauri`，
  # main 上根本没有这个目录 ⇒ 恒定红：`Couldn't detect Tauri dir`。
  # 结果：任何功能 PR 都会挂一个与本改动无关的红叉（Rust (test) 绿了也没用）。
  # 改成按路径触发：只有真的动了 Tauri 相关文件才跑。
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/tauri-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        # --ignore-scripts skips Electron's Chromium download (not needed here).
        run: npm install --ignore-scripts

      - name: Build Tauri app (no release)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ''