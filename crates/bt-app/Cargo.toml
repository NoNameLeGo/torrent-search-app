[package]
name = "bt-app"
description = "BT 聚合搜索 — Slint 桌面应用（**唯一的 UI**，对齐 docs/ROADMAP.md M4）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 产物名固定成 `bt-search.exe`（M7 要拿它当自包含单文件交付）。
[[bin]]
name = "bt-search"
path = "src/main.rs"

[dependencies]
bt-core = { path = "../bt-core" }
bt-providers = { path = "../bt-providers" }
bt-downloaders = { path = "../bt-downloaders" }
# ⑤ Torznab 的索引器（动态 provider）。⚠️ bt-torznab 依赖 bt-providers，
# 而 bt-providers **不认识** bt-torznab —— 所以"静态 17 家 + 动态索引器"的拼装
# 只能发生在这里（同时依赖两边的那一层）。
bt-torznab = { path = "../bt-torznab" }
# 与 spike/slint-ui 同一条 1.18 线（M1 就是在这条线上验的 #13548）。
# ⚠️ 不写 `features = [...]`：默认特性里已经含 windows 上要用的 backend-winit +
# renderer-software；CI 上靠运行时 `SLINT_BACKEND=winit-software` 避开 GPU。
slint = "1.18"
# ② 下载器配置的持久化（src/config_store.rs）。用 serde 而不是手写 `key=value` ——
# 密码/token 里出现 `=`、换行、非 ASCII 都得正确处理，手写格式迟早出事。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 网络 IO 必须有运行时；Slint 的 UI 是单线程的 —— 两者靠
# `slint::invoke_from_event_loop` 接起来（见 src/main.rs 的线程模型说明）。
# ⚠️ `net` 不能少：`runtime()` 用 `.enable_all()` 打开 **IO driver**，
# 而 IO driver 由 `net` 特性把门 —— 少了它 reqwest 会在运行期报
# "IO driver not enabled"（编译期不报）。这是 2026-10-16 补自检时发现的第二个坑。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
# 剪贴板（复制磁力）。⚠️ **不是新依赖**：`arboard` 已经在 lockfile 里 ——
# Slint 的 `i-slint-backend-winit` 用它做文本剪贴板，这里只是把同一个包直接声明出来。
# 版本跟着 lockfile 的 3.7 走，避免多拉一份。
# ⚠️ 必须关默认特性：默认的 `image-data` 会连带 image / tiff 一整串包，
# 而我们只用 `set_text`（2026-10-25 实测：不关的话 Cargo.lock 多出 tiff/fax/crossbeam-queue）。
arboard = { version = "3", default-features = false }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
# 集成测试看不到 crate 的普通依赖，用到什么就再声明什么。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
