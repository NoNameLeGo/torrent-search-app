[workspace]
resolver = "2"
members = ["crates/*"]
# src-tauri 是旧的 Tauri 实验壳（自己是一个独立 package），
# 不属于这个 workspace，但物理上在仓库内 —— 必须排除，否则 cargo 会报
# "current package believes it's in a workspace when it's not"。
exclude = ["src-tauri", "spike"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0"
publish = false

[profile.release]
opt-level = 2
